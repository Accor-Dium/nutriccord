name: Release

# Cada push/merge a main:
#   1. CI (lint + typecheck). Si falla, no hay release.
#   2. semantic-release calcula la versión SemVer a partir de los commits
#      (Conventional Commits), actualiza package.json/app.json/CHANGELOG.md,
#      crea el tag vX.Y.Z y el GitHub Release.
#   3. Si hubo release nueva, EAS Build compila el APK de Android y se adjunta al Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Versionar y publicar release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: semantic-release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  build-android:
    name: Build Android (EAS)
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verificar EXPO_TOKEN
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::warning::Falta el secret EXPO_TOKEN; se omite el build. Ver CLAUDE.md > Pipeline."

      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''
        with:
          ref: v${{ env.VERSION }}

      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 22
          cache: npm

      - if: env.EXPO_TOKEN != ''
        run: npm ci

      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS build (production, Android)
        if: env.EXPO_TOKEN != ''
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > build.json
          cat build.json

      - name: Adjuntar APK al GitHub Release
        if: env.EXPO_TOKEN != ''
        run: |
          URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          curl -fsSL "$URL" -o "nutriccord-v${VERSION}.apk"
          gh release upload "v${VERSION}" "nutriccord-v${VERSION}.apk" --clobber
